# Optional configuration override AFTER installing the bundle.
# '*' matches every provider using the llm-pi-ai adapter.
# To limit providers, use route names instead, e.g. [linksub, my-gateway].
# Append this item to the profile's existing patch array; do not overwrite it.
# The bundle already inserts the plugin. Do not insert it a second time.
- id: session-id-header
  config:
    providers: ['*']
    headers: [x-session-id]
    gptHeaders: [session-id, x-client-request-id]
    claudeHeaders: [x-claude-code-session-id]
